[project]
name = "revenueflowai"
version = "0.1.0"
description = "RevenueFlow AI backend — Order-to-Cash Exception Intelligence API, worker, and agent orchestration"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "authlib>=1.3",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "boto3>=1.35",
    "aioboto3>=13.2",
    "python-multipart>=0.0.12",
    "typer>=0.12",
    "anthropic>=0.39",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Session-scoped loop: the async engine in revenueflowai.db is a
# process-lifetime singleton with its own connection pool. A fresh event
# loop per test (pytest-asyncio's default) breaks asyncpg, since pooled
# connections stay bound to the loop that created them.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `Depends(...)` default-argument pattern is idiomatic, not a bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Hand-written migrations favor one-line-per-table-operation readability
# over strict wrapping; autogenerated revisions will inherit this too.
"src/revenueflowai/migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
