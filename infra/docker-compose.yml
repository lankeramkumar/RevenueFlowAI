name: revenueflowai

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: revenueflow
      POSTGRES_PASSWORD: revenueflow
      POSTGRES_DB: revenueflow
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revenueflow -d revenueflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    # S3-compatible local object store. MinIO's Docker Hub and Quay images
    # now require a registry login (anonymous pulls denied as of this
    # build) — LocalStack's S3 service is the documented fallback from the
    # original stack decision and pulls publicly; see
    # docs/implementation-plan.md's decisions log for this deviation.
    # :latest now gates S3 behind a paid license activation check; this
    # pinned community version (pre-paywall) works without a token.
    image: localstack/localstack:3.8
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
    volumes:
      - localstack-data:/var/lib/localstack
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/4566"]
      interval: 5s
      timeout: 5s
      retries: 15

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/revenueflow-realm.json:/opt/keycloak/data/import/revenueflow-realm.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.backend
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://revenueflow:revenueflow@db:5432/revenueflow
      OIDC_ISSUER: http://keycloak:8080/realms/revenueflow
      OIDC_JWKS_URL: http://keycloak:8080/realms/revenueflow/protocol/openid-connect/certs
      S3_ENDPOINT_URL: http://localstack:4566
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/healthz').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.backend
    command: ["python", "-m", "revenueflowai.worker"]
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://revenueflow:revenueflow@db:5432/revenueflow
      S3_ENDPOINT_URL: http://localstack:4566
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/Dockerfile.frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_OIDC_AUTHORITY: http://localhost:8080/realms/revenueflow
      VITE_OIDC_CLIENT_ID: revenueflow-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  db-data:
  localstack-data:
